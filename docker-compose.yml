services:
  geofinder:
    build: .
    image: geofinder:latest
    # Pas de container_name : un nom fixe empêche Compose de recréer le
    # conteneur proprement, et le moindre conteneur resté en place fait
    # échouer « up » sur un conflit de nom. Compose nomme lui-même
    # geofinder-geofinder-1, et gère le remplacement sans heurt.
    ports:
      - "8000:8000"
    environment:
      # Sans aucune clé, GeoFinder utilise KartaView (aucune inscription).
      GEOFINDER_PROVIDER: "${GEOFINDER_PROVIDER:-auto}"
      MAPILLARY_ACCESS_TOKEN: "${MAPILLARY_ACCESS_TOKEN:-}"
      GOOGLE_MAPS_API_KEY: "${GOOGLE_MAPS_API_KEY:-}"
      GEOFINDER_MAX_PANOS: "${GEOFINDER_MAX_PANOS:-250}"
      GEOFINDER_SPACING_M: "${GEOFINDER_SPACING_M:-120}"
      GEOFINDER_WORKERS: "${GEOFINDER_WORKERS:-8}"
      GEOFINDER_SV_SIZE: "${GEOFINDER_SV_SIZE:-512x512}"
    volumes:
      - geofinder-data:/data
    restart: unless-stopped

volumes:
  geofinder-data:
